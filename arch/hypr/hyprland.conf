#Hyprnvidia
source = /home/rgarber11/.config/hypr/nvidia.conf

# nwg-displays
source = ~/.config/hypr/monitors.conf

exec-once = uwsm app -s b -- /usr/lib/pam_kwallet_init --no-startup-id 
exec-once = uwsm app -- nm-applet 
exec-once = uwsm app -- blueman-applet
exec-once = hyprpm reload -n
exec-once = uwsm app -s b -- hypridle > /home/rgarber11/hypridle.log
exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- swaync
exec-once = uwsm app -- quickshell
exec-once = uwsm app -- wl-paste --type text --watch cliphist store #Stores only text data
exec-once = uwsm app -- wl-paste --type image --watch cliphist store #Stores only image data
exec-once = uwsm app -- xrandr --dpi 120

$terminal = kitty
$fileManager = dolphin
$menu = anyrun
$browser = zen-browser

ecosystem {
    no_update_news = true
}
input {
    kb_layout = us,ru
    kb_variant = ,phonetic
    kb_model =
    kb_options = compose:menu,caps:swapescape,grp:win_space_toggle
    kb_rules =
 
    follow_mouse = 1
    numlock_by_default = true
    touchpad {
        natural_scroll = yes
        clickfinger_behavior = true
    }
    resolve_binds_by_sym = false
    sensitivity = 0
}

general {

    gaps_in = 4
    gaps_out = 8
    border_size = 1
    gaps_workspaces = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    allow_tearing = false
}
group {
    col.border_active = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.border_inactive = rgba(595959aa)
    groupbar {
        font_size = 10
        col.active = rgba(657b83ff)
        col.inactive = rgba(002b36ff)
    }
}
xwayland {
    force_zero_scaling = true
}
# debug {
#     disable_logs = false
# }
decoration {

    rounding = 15
    
    blur {
        enabled = false
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes


    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = yes 
    preserve_split = yes 
}

master {
    new_status = master
}

gestures {
    workspace_swipe = true
    workspace_swipe_forever = true
}

misc {
    disable_hyprland_logo = false
}

plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = true # laptop touchpad, 4 fingers
        gesture_distance = 300 # how far is the "max"
        gesture_positive = false # positive = swipe down. Negative = swipe up.
    }
    # Shameless copy of @JustinMDickey's Hyprbar config
    hyprbars {
        bar_height = 38
        bar_color = rgb(002b36)
        col.text = rgb(93a1a1)
        bar_text_size = 12
        bar_text_font = JetBrainsMono Nerd Font Mono Bold
        bar_button_padding = 12
        bar_buttons_alignment = right
        bar_padding = 10
        bar_precedence_over_border = true
        hyprbars-button = rgb(dc322f), 20, , hyprctl dispatch killactive
   }
}
windowrulev2 = suppressevent maximize, class:.* 
windowrulev2 = idleinhibit fullscreen, class:^(.*)$
windowrulev2 = float,class:^(mscore)|(MuseScore*)$,title:^(mscore)|(MuseScore*)$
windowrulev2 = tile,title:^(Foliate)$
windowrulev2 = float, class=(hp10bii\+\.exe),title:(hp 10bii\+)
windowrulev2 = opaque 0,class:^(hp10bii)*$,title:^(HP 10bII)(.*)$


$mainMod = SUPER

# Main Binds
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exec, uwsm stop 
bind = $mainMod, V, togglefloating, 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, T, workspaceopt, allfloat
bind = $mainMod, G, togglegroup
bind = $mainMod, N, changegroupactive, f 
bind = $mainMod, B, changegroupactive, b 
bind = $mainMod, grave, hyprexpo:expo, toggle

# Application Binds
bind = $mainMod, E, exec, uwsm app -- $fileManager
bindr = ALT,SPACE, exec, uwsm app -- $menu
bind = $mainMod, Q, exec, $terminal
bind = $mainMod SHIFT, Print, exec, uwsm app --  grimblast copysave area
bind = $mainMod, Print, exec, uwsm app -- grimblast copysave screen
bind = $mainMod SHIFT, O, exec, /home/rgarber11/.config/hypr/hyprland/dpms.sh
bind = $mainMod, I, exec,uwsm app -- $browser

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL,right, workspace, e+1
bind = $mainMod CTRL,left, workspace, e-1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT CTRL,right, movetoworkspace, +1
bind = $mainMod SHIFT CTRL,left, movetoworkspace, -1
bind = $mainMod SHIFT, q, exec, uwsm app -- hyprctl activewindow > ~/active.window
bind = $mainMod CTRL, c, exec, uwsm app -- grimblast save area - | tesseract - - | wl-copy
bind = $mainMod CTRL, r, exec, uwsm app -- grimblast save area - | tesseract -l rus - - | wl-copy
bind = $mainMod CTRL, u, exec, uwsm app -- grimblast save area - | tesseract -l ukr - - | wl-copy
# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Send Signal to NWG Panel for Lock Indicators
bind = , Caps_Lock, exec, /home/rgarber11/.config/hypr/hyprland/capslock_sender.sh
bind = , Num_Lock, exec, /home/rgarber11/.config/hypr/hyprland/numlock_sender.sh
# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, +1
bind = $mainMod, mouse_up, workspace, -1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop Media Keybinds
bindl =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=, XF86MonBrightnessUp, exec, brightnessctl set 10%+
bindl=, XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindl=, XF86ScreenSaver, exec, loginctl lock-session

bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioPrev, exec, playerctl previous
bindl=, XF86AudioNext, exec, playerctl next
