# Reverse-forward the desktop clipboard responder into every Coder workspace.
#
# herdr-clipboard.socket listens on desktop 127.0.0.1:52052 and answers each
# connection with a fresh wl-paste; this carries workspace 127.0.0.1:52052 to
# it, so Neovim's paste provider there (bin/herdr-clipboard-paste) reads this
# machine's clipboard. Both host patterns are covered because `coder
# config-ssh` generates an alias in each form.
#
# A wildcard rather than a per-workspace systemd unit: workspaces are
# ephemeral, so anything requiring enrollment would have to be repeated for
# every new one. Whichever connection reaches a workspace first -- an
# interactive `herdr --remote`, or herdr-mirror's daemon ControlMaster --
# establishes the forward, and a workspace created tomorrow is covered with
# no action at all.
#
# Deliberately NO ExitOnForwardFailure. herdr-mirror opens a separate direct
# ssh connection per mirror pane (its pane.rs: "Every stream gets its own
# direct ssh connection"), and each one re-attempts this same bind. Only the
# first can hold the port; the rest must warn and carry on rather than drop
# the stream. The duplicate is harmless because the winner is already
# providing the identical service -- which was NOT true of the 2026-08-19
# design, where a persistent master could outlive the socat it pointed at and
# leave a live tunnel to a dead endpoint. An always-listening socket unit is
# what makes a surviving forward safe.
Host *.coder coder.*
	RemoteForward 127.0.0.1:52052 127.0.0.1:52052
